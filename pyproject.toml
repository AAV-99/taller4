[project]
name = "prof_agent"
version = "0.1.0"
description = "Prototipo multiagente de Sistema Tutorial Inteligente (Taller 4 SI7016) con CrewAI"
authors = [{ name = "AAV-99" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.15.17,<2.0.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.40",
    "mcp>=1.0",
]

[dependency-groups]
notebook = ["ipykernel>=6.29", "nbconvert>=7.16"]

[project.scripts]
kickoff = "prof_agent.main:kickoff"
run_crew = "prof_agent.main:kickoff"
plot = "prof_agent.main:plot"
run_with_trigger = "prof_agent.main:run_with_trigger"
evaluar = "prof_agent.evaluation:main"
mcp_server = "prof_agent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
